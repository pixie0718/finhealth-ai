# FinHealth AI — full stack (backend + frontend)
# Usage:
#   cp backend/.env.example backend/.env   # add SECRET_KEY / GEMINI_API_KEY
#   docker compose up --build
# Then open http://localhost:3002  (API at http://localhost:8000/docs)

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Fallback if .env is missing SECRET_KEY (override in .env for production)
      SECRET_KEY: ${SECRET_KEY:-change-me-in-env}
      # Keep the SQLite DB on a persistent volume (not inside the app code dir)
      DATABASE_URL: sqlite:////app/dbdata/finhealth.db
    volumes:
      - fh_data:/app/dbdata
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Browser talks to the backend on the host's published port
        REACT_APP_API_URL: http://localhost:8000
    ports:
      - "3002:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  fh_data:
